name: Update publications
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_publications.py
      - scripts/publications-config.json
      - scripts/requirements-publications.txt
      - .github/workflows/publications.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: publication-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-publications.txt
      - run: pip install -r scripts/requirements-publications.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/publications.test.js
      - name: Generate complete citation report and publication data
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python scripts/update_publications.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.5.10'
          bundler-cache: true
      - name: Verify site before saving new data
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter
      - run: bundle exec ruby scripts/check_links.rb
      - name: Commit validated snapshot
        id: commit
        run: |
          git add _data/publications.json data/publications.csv pdf/citations-latest.pdf
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update publications and citation report'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
