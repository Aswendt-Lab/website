title: Aswendt Lab
description: Understanding and improving recovery after stroke through neuroimaging, neuroengineering, and open science. Aswendt Lab, Frankfurt, Germany.
theme: minima

url: "https://aswendt-lab.github.io"
baseurl: "/website"
repository: "Aswendt-Lab/website"

show_menu: true
show_footer: false
# Add a valid analytics tracking ID only when analytics is configured.

plugins:
  - jekyll-feed
  - jekyll-seo-tag

minima:
  social_links:
    - { platform: github, user_url: "https://github.com/Aswendt-Lab"}
    - { platform: youtube, user_url: "https://www.youtube.com/@aswendtlab1639" }

header_pages:
  - projects.md
  - software.md
  - paper.md
  - team.md
  - news.md
  - opportunities.md
  - contact.md

github:
  is_project_page: false

exclude:
  - gemfiles/
  - Gemfile*
  - README.md
